<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">How to trigger the Lingua Lab release workflow</title>
  <desc id="desc">A GitHub Actions workflow dispatch walkthrough: choose Create PRD Release Branch, select master, click Run workflow, then wait for the release dispatch job.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f2f8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#16324a" flood-opacity=".16"/></filter>
  </defs>
  <rect width="960" height="560" rx="24" fill="url(#bg)"/>
  <rect x="34" y="30" width="892" height="58" rx="12" fill="#172033"/>
  <circle cx="62" cy="59" r="8" fill="#ff6b6b"/><circle cx="88" cy="59" r="8" fill="#ffd166"/><circle cx="114" cy="59" r="8" fill="#70d6a6"/>
  <text x="146" y="66" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">GitHub Actions / Run workflow</text>
  <rect x="34" y="112" width="254" height="382" rx="16" fill="#fff" stroke="#c8d8e4"/>
  <text x="58" y="148" fill="#52677a" font-family="system-ui,sans-serif" font-size="15" font-weight="700">WORKFLOWS</text>
  <rect x="52" y="171" width="218" height="58" rx="10" fill="#e6f3fa" stroke="#1685b5" stroke-width="2"/>
  <text x="68" y="196" fill="#172033" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Create PRD</text>
  <text x="68" y="217" fill="#172033" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Release Branch</text>
  <text x="58" y="278" fill="#52677a" font-family="system-ui,sans-serif" font-size="14">Select this workflow,</text>
  <text x="58" y="299" fill="#52677a" font-family="system-ui,sans-serif" font-size="14">then choose Run workflow.</text>
  <path d="M288 246h50" stroke="#1685b5" stroke-width="4"/><path d="m329 234 16 12-16 12" fill="none" stroke="#1685b5" stroke-width="4"/>
  <rect x="366" y="112" width="560" height="382" rx="16" fill="#fff" stroke="#c8d8e4" filter="url(#shadow)"/>
  <text x="398" y="153" fill="#172033" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Run workflow</text>
  <text x="398" y="183" fill="#52677a" font-family="system-ui,sans-serif" font-size="14">Use the trusted production branch.</text>
  <text x="398" y="224" fill="#52677a" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Use workflow from</text>
  <rect x="398" y="238" width="232" height="48" rx="8" fill="#f7f9fc" stroke="#9bb1c1"/>
  <text x="420" y="269" fill="#172033" font-family="ui-monospace,monospace" font-size="17">master</text>
  <path d="m600 258 10 10 10-10" fill="none" stroke="#52677a" stroke-width="2"/>
  <rect x="718" y="238" width="164" height="48" rx="9" fill="#1f883d"/>
  <text x="800" y="269" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Run workflow</text>
  <text x="398" y="327" fill="#52677a" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Expected sequence</text>
  <circle cx="416" cy="363" r="12" fill="#1f883d"/><text x="416" y="368" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="700">✓</text>
  <text x="442" y="369" fill="#172033" font-family="system-ui,sans-serif" font-size="16">Create release/homelab/YYYYMMDD</text>
  <path d="M416 379v27" stroke="#9bb1c1" stroke-width="3"/>
  <circle cx="416" cy="419" r="12" fill="#1f883d"/><text x="416" y="424" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="700">✓</text>
  <text x="442" y="425" fill="#172033" font-family="system-ui,sans-serif" font-size="16">Dispatch PRD Release separately</text>
  <rect x="398" y="451" width="484" height="26" rx="8" fill="#edf7ef"/>
  <text x="414" y="469" fill="#1f6f35" font-family="ui-monospace,monospace" font-size="13">Successful trigger run: #37110833514</text>
</svg>
