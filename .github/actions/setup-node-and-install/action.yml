name: Set up Node.js and install dependencies
description: Set up the pinned Node.js runtime and install the lockfile dependencies.
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: npm
    - name: Install locked dependencies
      shell: bash
      run: npm ci
