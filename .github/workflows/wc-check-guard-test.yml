name: Test reusable workflow branch guard

on:
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Choose one of the two guard cases.
        required: true
        type: choice
        options:
          - refs/heads/not-master
          - refs/heads/master

permissions: {}

jobs:
  check_guard:
    name: Run the selected guard case
    uses: ./.github/workflows/wc-check-guard.yml
    with:
      workflow_ref: ${{ inputs.workflow_ref }}

  stop_after_pass:
    name: Stop after the accepted guard case
    if: ${{ inputs.workflow_ref == 'refs/heads/master' }}
    needs: check_guard
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: End the safe guard-only test
        run: echo 'The master case passed. This test workflow ends here; no release actions are included.'
