name: PRD Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingua-lab-production
  cancel-in-progress: false

jobs:
  build-production-artifact:
    name: Build production artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted master revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build GitHub Pages artifact once
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-production-artifact
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the built Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-published-pages:
    name: Verify published Pages routes
    needs: deploy-pages
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
    steps:
      - name: Check out browser verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Verify the deployed deep link through the Pages 404 fallback
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const pageUrl = process.env.PAGE_URL;
          if (!pageUrl) throw new Error('PAGE_URL is required');

          const deploymentUrl = new URL(pageUrl);
          if (!deploymentUrl.pathname.endsWith('/')) deploymentUrl.pathname += '/';
          const deepLink = new URL('nihongo-o-benkyuo/kana', deploymentUrl);
          const expectedPathname = deepLink.pathname;

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.goto(deepLink.toString(), { waitUntil: 'networkidle' });
            await page.getByRole('heading', { level: 1, name: /Kana/ }).waitFor({ state: 'visible' });
            if (new URL(page.url()).pathname !== expectedPathname) {
              throw new Error(`expected final pathname ${expectedPathname}, received ${new URL(page.url()).pathname}`);
            }
          } finally {
            await browser.close();
          }
          NODE
