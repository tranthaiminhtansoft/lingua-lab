name: Create PRD Release Branch

on:
  workflow_dispatch:

permissions: {}

jobs:
  create_release_branch:
    name: 🌿 Create release branch from master
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_branch: ${{ steps.create.outputs.release_branch }}
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create release branch from current date
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: bash scripts/release/create-branch.sh
  dispatch_release:
    name: 🚀 Dispatch PRD Release
    needs: create_release_branch
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch PRD Release as a separate workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.create_release_branch.outputs.release_branch }}
        run: |
          set -euo pipefail
          gh workflow run prd-release.yml \
            --repo "$GH_REPOSITORY" \
            --ref master \
            -f candidate_ref="$RELEASE_BRANCH"
          {
            echo '## 🚀 PRD Release dispatched'
            echo
            echo "- Candidate branch: \`$RELEASE_BRANCH\`"
            echo '- The release workflow resolves and pins the branch commit during validation.'
            echo '- PRD Release runs separately from the trusted master workflow definition.'
          } >> "$GITHUB_STEP_SUMMARY"
