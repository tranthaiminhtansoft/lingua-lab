name: Release Gate

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  policy-baseline:
    name: Release policy baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted policy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Validate fail-closed reviewer configuration
        run: node scripts/verify-repo-policy.mjs
      - name: Record bootstrap limitation
        run: |
          echo 'Current-head review and required-check aggregation are not enabled until trusted profile identity mappings and application check contexts are configured.'
          echo 'This workflow does not deploy, release, merge, or execute PR code.'
