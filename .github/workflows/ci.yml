name: PR Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate bootstrap policy configuration
        run: node scripts/verify-repo-policy.mjs
  application-validation:
    name: Application validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit -- --run
      - name: Build GitHub Pages candidate
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser smoke checks against the Pages base path
        env:
          CI: 'true'
          GITHUB_ACTIONS: 'true'
        run: npm run test:e2e
