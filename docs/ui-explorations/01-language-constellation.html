<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lingua Lab — Language Constellation</title><style>
:root{color-scheme:dark;--bg:#080d18;--ink:#eef4ff;--muted:#9caeca;--line:#2c4267;--cyan:#79e4ec;--coral:#ff8d76;--gold:#ffd477}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#19365a 0,#0d1729 36%,#080d18 75%);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:800;letter-spacing:.13em;text-transform:uppercase}.tag{color:var(--gold);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}.hero{max-width:620px;margin:74px auto 34px;text-align:center}.hero h1{margin:0;font:clamp(3.2rem,8vw,6.8rem)/.85 Georgia,serif;letter-spacing:-.08em}.hero p{color:var(--muted);font-size:1.05rem}.sky{position:relative;min-height:470px;margin:20px auto 0;border:1px solid rgba(121,228,236,.2);border-radius:50% 50% 22px 22px;background:radial-gradient(circle at 50% 48%,rgba(42,87,128,.28),transparent 36%),linear-gradient(180deg,rgba(9,22,41,.3),rgba(4,8,18,.65));overflow:hidden}.sky:before,.sky:after{content:'✦  ·  ✧   ·  ✦   ·   ✧  ·  ✦';position:absolute;color:rgba(238,244,255,.25);letter-spacing:28px;font-size:13px;white-space:nowrap}.sky:before{top:35px;left:5%}.sky:after{right:2%;bottom:34px;transform:rotate(180deg)}.orbit{position:absolute;inset:11% 18%;border:1px solid rgba(121,228,236,.16);border-radius:50%;transform:rotate(-12deg)}.orbit.two{inset:25% 9%;transform:rotate(24deg);border-color:rgba(255,212,119,.13)}svg{position:absolute;inset:0;width:100%;height:100%}.constellation{position:absolute;display:grid;place-items:center;width:148px;height:148px;border:1px solid currentColor;border-radius:50%;background:rgba(8,13,24,.82);box-shadow:0 0 0 9px rgba(8,13,24,.36),0 0 38px currentColor;color:var(--cyan);text-decoration:none;transition:transform .2s,box-shadow .2s}.constellation:hover,.constellation:focus-visible{transform:scale(1.07);box-shadow:0 0 0 9px rgba(8,13,24,.36),0 0 65px currentColor;outline:2px solid #fff;outline-offset:4px}.constellation b{display:block;font:3.4rem/1 Georgia,serif}.constellation span{display:block;color:var(--ink);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.76rem}.nihongo{left:17%;top:28%;color:var(--coral)}.english{right:17%;bottom:20%;color:var(--cyan)}.small-star{position:absolute;color:var(--gold);font-size:1.5rem}.s1{left:45%;top:22%}.s2{right:32%;top:31%}.s3{left:33%;bottom:23%}.hint{text-align:center;color:var(--muted);margin:22px 0 0}.route{min-height:24px;text-align:center;color:var(--gold);font-weight:700}.foot{display:flex;justify-content:space-between;color:#7183a3;font-size:.8rem;margin-top:30px}@media(max-width:650px){.shell{width:min(100% - 24px,480px);padding-top:18px}.top{align-items:flex-start}.tag{font-size:.65rem;text-align:right}.hero{margin:55px auto 25px}.hero h1{font-size:clamp(3.4rem,17vw,5.3rem)}.sky{min-height:580px;border-radius:48% 48% 20px 20px}.orbit{inset:15% 3%;transform:rotate(8deg)}.orbit.two{inset:34% -10%;}.nihongo{left:50%;top:22%;transform:translateX(-50%)}.english{right:auto;left:50%;bottom:16%;transform:translateX(-50%)}.constellation:hover,.constellation:focus-visible{transform:translateX(-50%) scale(1.04)}.small-star{display:none}.foot{display:block;text-align:center}.foot span{display:block;margin-top:7px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">Lingua Lab</div><div class="tag">Choose a constellation</div></header><section class="hero"><h1>Find your<br>language.</h1><p>Two worlds are waiting in the same sky. Start wherever curiosity pulls you.</p></section><section class="sky" aria-label="Language constellations"><div class="orbit"></div><div class="orbit two"></div><svg viewBox="0 0 1000 470" aria-hidden="true"><path d="M260 205 C390 85 590 115 745 360" fill="none" stroke="#506b92" stroke-width="1.5" stroke-dasharray="5 12"/><path d="M260 205 C380 290 535 290 745 360" fill="none" stroke="#506b92" stroke-width="1" opacity=".45"/></svg><a class="constellation nihongo" href="#nihongo" data-route="/lingua-lab/nihongo/"><div><b>あ</b><span>Nihongo</span></div></a><a class="constellation english" href="#english" data-route="/lingua-lab/english/"><div><b>A</b><span>English</span></div></a><i class="small-star s1">✦</i><i class="small-star s2">✧</i><i class="small-star s3">✦</i></section><p class="hint">Tap a constellation to enter its learning path.</p><p class="route" aria-live="polite"></p><footer class="foot"><span>One sky · many ways to learn</span><span>Responsive concept / static mockup</span></footer></main><script>document.querySelectorAll('[data-route]').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector('.route').textContent='Prototype route: '+a.dataset.route})</script></body></html>
