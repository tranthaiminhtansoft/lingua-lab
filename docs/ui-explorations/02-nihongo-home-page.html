<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Japanese Learning / 日本語学習</title>
  <style>
    :root {
      --washi: #fff8e8;
      --ink: #18253a;
      --indigo: #253a78;
      --vermilion: #e64c38;
      --sakura: #f5a6b8;
      --sun: #f8cf4a;
      --border: 3px solid var(--ink);
      --hard-shadow: 7px 7px 0 var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--washi);
    }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background: var(--washi);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    button {
      font: inherit;
    }

    .page {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: clamp(28px, 6vw, 80px) clamp(18px, 5vw, 64px);
    }

    .learning {
      width: min(1080px, 100%);
    }

    .header {
      margin-bottom: clamp(32px, 6vw, 64px);
    }

    h1 {
      max-width: 14ch;
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5.4rem);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.95;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      margin-top: 0.18em;
      color: var(--indigo);
      font-size: 0.58em;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    h1::after {
      content: "";
      display: block;
      width: clamp(80px, 12vw, 132px);
      height: 12px;
      margin-top: 24px;
      border: var(--border);
      background: var(--vermilion);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
    }

    .card {
      position: relative;
      display: grid;
      overflow: hidden;
      min-width: 0;
      min-height: 230px;
      align-content: space-between;
      padding: 26px;
      border: var(--border);
      border-radius: 0;
      color: var(--ink);
      background: var(--washi);
      box-shadow: var(--hard-shadow);
      text-align: left;
      appearance: none;
    }

    button.card {
      cursor: pointer;
    }

    .card:nth-child(1) {
      background: var(--sun);
    }

    .card:nth-child(2) {
      background: var(--sakura);
    }

    button.card:hover,
    button.card:focus-visible {
      transform: translate(-3px, -3px);
      box-shadow: 10px 10px 0 var(--ink);
    }

    button.card:focus-visible {
      outline: 3px solid var(--vermilion);
      outline-offset: 4px;
    }

    button.card:active {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .number {
      width: fit-content;
      border: 2px solid var(--ink);
      color: var(--washi);
      background: var(--indigo);
      padding: 5px 8px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .label {
      display: block;
    }

    .label strong,
    .label span {
      display: block;
    }

    .label strong {
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.025em;
    }

    .label span {
      margin-top: 8px;
      color: var(--ink);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .kana-list {
      display: grid;
      gap: 6px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .kana-list .kana-item {
      display: block;
      margin: 0;
      font-size: inherit;
    }

    .kana-item > span {
      display: inline;
      margin: 0;
      font-size: inherit;
    }

    .card--disabled {
      isolation: isolate;
      cursor: default;
    }

    .coming-soon {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: 145%;
      padding: 14px 8px;
      border-block: 3px solid var(--ink);
      color: var(--washi);
      background: var(--vermilion);
      box-shadow: 0 5px 0 var(--ink);
      font-size: clamp(0.9rem, 2vw, 1.15rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.2;
      text-align: center;
      transform: translate(-50%, -50%) rotate(-12deg);
      white-space: nowrap;
    }

    .coming-soon span {
      display: inline;
      margin: 0;
      color: inherit;
      font-size: inherit;
    }

    @media (max-width: 768px) {
      .page {
        align-items: start;
      }

      .header {
        margin-bottom: 30px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .card {
        min-height: 150px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      button.card:hover,
      button.card:focus-visible,
      button.card:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="learning" aria-labelledby="page-title">
      <header class="header">
        <h1 id="page-title">Japanese Learning <span lang="ja">/ 日本語学習</span></h1>
      </header>

      <div class="cards" aria-label="Learning categories">
        <button class="card" type="button">
          <span class="number" aria-hidden="true">01</span>
          <span class="label">
            <strong>Kana</strong>
            <span lang="ja">かな</span>
            <span class="kana-list" role="list">
              <span class="kana-item" role="listitem">Hiragana / <span lang="ja">ひらがな</span></span>
              <span class="kana-item" role="listitem">Katakana / <span lang="ja">カタカナ</span></span>
              <span class="kana-item" role="listitem">Dakuten / <span lang="ja">濁点</span></span>
            </span>
          </span>
        </button>

        <div class="card card--disabled" role="group" aria-disabled="true" aria-label="Grammar — Coming soon / 準備中">
          <span class="number" aria-hidden="true">02</span>
          <span class="label"><strong>Grammar</strong><span lang="ja">文法</span></span>
          <span class="coming-soon">COMING SOON / <span lang="ja">準備中</span></span>
        </div>

        <div class="card card--disabled" role="group" aria-disabled="true" aria-label="Vocabulary — Coming soon / 準備中">
          <span class="number" aria-hidden="true">03</span>
          <span class="label"><strong>Vocabulary</strong><span lang="ja">語彙</span></span>
          <span class="coming-soon">COMING SOON / <span lang="ja">準備中</span></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
